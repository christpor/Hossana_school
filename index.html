<!doctype html>
<html lang="en" data-lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hosanna School for Cambodian Children | សាលាហូសាណា</title>
    <meta name="description" content="Official website of Hosanna School for Cambodian Children (Hope School / 희망학교). Educating over 800+ students from ECE to Grade 12 in Phnom Penh, Cambodia." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Kantumruy+Pro:ital,wght@0,400;0,500;0,700;1,400&family=Noto+Sans+Khmer:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      // No-flash language bootstrap: read persisted lang before first paint
      (function () {
        try {
          var lang = localStorage.getItem('hosanna-lang');
          if (lang === 'kh' || lang === 'en') {
            document.documentElement.setAttribute('data-lang', lang);
            document.documentElement.lang = lang;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF7F2] text-[#002D62] antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
